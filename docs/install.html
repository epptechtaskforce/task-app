<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5e173f">
<meta name="robots" content="noindex">
<title>Install Task Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasks">
<style>
  :root { --a: #5e173f; --b: #a63a80; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font: 600 1.05rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; background: linear-gradient(160deg, var(--a), var(--b)); display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); overflow: hidden; }
  main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 34px; text-align: center; }
  .app { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 24px 50px -12px rgba(0, 0, 0, .55); animation: rise .7s cubic-bezier(.2, 1.4, .4, 1) both, bob 3.6s ease-in-out .8s infinite; }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -.01em; }
  .go { position: relative; width: 100%; border: 0; border-radius: 22px; padding: 20px 24px; font: 800 1.35rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--a); background: #fff; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 0 18px 36px -12px rgba(0, 0, 0, .5); animation: rise .7s cubic-bezier(.2, 1.4, .4, 1) .12s both; transition: transform .15s; }
  .go:active { transform: scale(.96); }
  .go::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 3px solid #fff; animation: ping 2.2s ease-out infinite; pointer-events: none; }
  .go svg { width: 28px; height: 28px; flex: none; }
  .go[disabled] { opacity: .6; }
  .hint { font-weight: 600; font-size: .95rem; opacity: .85; margin: -14px 0 0; min-height: 1.4em; }
  /* the picture steps (shown only when the browser cannot install with one tap) */
  .sheet { position: fixed; inset: 0; z-index: 5; display: none; align-items: flex-end; justify-content: center; background: rgba(20, 5, 15, .55); }
  .sheet.on { display: flex; }
  .panel { width: 100%; max-width: 440px; background: #fff; color: #2b1020; border-radius: 28px 28px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); animation: slide .35s cubic-bezier(.2, .9, .3, 1) both; }
  .steps { display: flex; flex-direction: column; gap: 14px; margin: 0 0 18px; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 14px; background: #f7ecf2; border-radius: 18px; padding: 12px 14px; font-weight: 800; font-size: 1.1rem; animation: rise .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .steps li:nth-child(2) { animation-delay: .12s; } .steps li:nth-child(3) { animation-delay: .24s; }
  .steps .n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--a); color: #fff; display: grid; place-items: center; font-size: .95rem; }
  .steps svg { flex: none; width: 44px; height: 44px; color: var(--a); }
  .steps .t { flex: 1; text-align: left; }
  .point { position: relative; height: 42px; display: flex; justify-content: center; color: var(--a); }
  .point svg { width: 38px; height: 38px; animation: nudge 1s ease-in-out infinite; }
  .ok { width: 100%; border: 0; border-radius: 16px; padding: 14px; font: 800 1.1rem system-ui, sans-serif; color: #fff; background: var(--a); cursor: pointer; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.9); } }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @keyframes ping { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12, 1.35); } }
  @keyframes slide { from { transform: translateY(100%); } }
  @keyframes nudge { 50% { transform: translateY(7px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <img class="app" src="icon-512.png" width="132" height="132" alt="">
  <h1>Task Manager</h1>
  <button id="go" class="go" type="button" disabled><span id="goIco"></span><span id="goTxt">Install</span></button>
  <p id="hint" class="hint"></p>
</main>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="How to install">
  <div class="panel"><ul id="steps" class="steps"></ul><div id="point" class="point"></div><button id="ok" class="ok" type="button">OK</button></div>
</div>
<script src="js/install.js?v=20261167"></script>
</body>
</html>
